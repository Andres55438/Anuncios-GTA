<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png">
<title>Anuncios GTA</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="logo">ANUNCIOS <span>GTA</span></div><button id="install" hidden>Instalar</button></header>
<main>
<section class="form">
<h1>Crear anuncio</h1><p>Generá tu diseño y modificá todo desde el chat.</p>
<input id="puesto" placeholder="Puesto">
<input id="ubicacion" placeholder="Ubicación">
<input id="salario" placeholder="Salario / bonificación">
<textarea id="requisitos" placeholder="Requisitos"></textarea>
<textarea id="funciones" placeholder="Funciones"></textarea>
<input id="contacto" placeholder="Contacto">
<select id="estilo"><option>retail corporativo GTA</option><option>tienda / supermercado</option><option>bodega / logística</option><option>oficina corporativa</option><option>minimalista</option></select>
<button id="gen">✨ Generar diseño</button><div id="status"></div>
</section>
<section class="design"><div class="title"><b>Diseño</b><button id="save" disabled>Guardar</button></div>
<div class="preview"><div id="empty">Tu diseño aparecerá aquí</div><img id="img" hidden></div>
</section>
<section class="chat"><div class="chat-title"><b>🤖 Asistente GTA</b><small>Pedile cualquier cambio</small></div>
<div id="msgs"><div class="bot">¡Qué onda bro! Decime qué querés agregar, quitar o cambiar.</div></div>
<div class="chips"><button data-q="Agregá contratación inmediata">Contratación inmediata</button><button data-q="Hacelo más llamativo">Más llamativo</button><button data-q="Hacé una versión para Instagram">Instagram</button></div>
<div class="send"><input id="msg" placeholder="Ej. agregá disponibilidad de horario"><button id="go">➤</button></div></section>
</main>
<script src="/app.js"></script></body></html>
